<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self';" />
    <title>Trello Gadget</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div id="app" class="gadget">
      <!-- Draggable title bar -->
      <header class="titlebar">
        <div class="title" id="boardTitle">Trello Gadget</div>
        <div class="window-controls">
          <button id="settingsBtn" class="ctrl" title="Settings" aria-label="Settings">⚙</button>
          <button id="refreshBtn" class="ctrl" title="Refresh from Trello" aria-label="Refresh">⟳</button>
          <button id="pinBtn" class="ctrl" title="Toggle always-on-top" aria-label="Pin">📌</button>
          <button id="minBtn" class="ctrl" title="Minimize" aria-label="Minimize">—</button>
          <button id="closeBtn" class="ctrl close" title="Close" aria-label="Close">✕</button>
        </div>
      </header>

      <!-- View toggle -->
      <nav class="tabs">
        <button id="tabGadget" class="tab active" data-view="gadget">Columns</button>
        <button id="tabStats" class="tab" data-view="stats">Stats</button>
      </nav>

      <!-- GADGET VIEW -->
      <section id="viewGadget" class="view active">
        <div class="row">
          <label for="boardSelect" class="label">Board</label>
          <select id="boardSelect" class="select">
            <option value="">Loading…</option>
          </select>
        </div>
        <div class="row">
          <label for="columnSelect" class="label">Column</label>
          <select id="columnSelect" class="select">
            <option value="__all__">All columns</option>
          </select>
        </div>
        <div id="columns" class="columns"></div>
      </section>

      <!-- STATS VIEW -->
      <section id="viewStats" class="view">
        <div class="row">
          <label for="chartSelect" class="label">Chart</label>
          <select id="chartSelect" class="select">
            <option value="cardsPerList">Cards per column</option>
            <option value="overTime">Cards per column over time</option>
            <option value="statusBreakdown">Status breakdown</option>
            <option value="labels">Cards per label</option>
          </select>
        </div>
        <div class="summary" id="summary"></div>
        <div class="chart-wrap">
          <canvas id="chart"></canvas>
          <div id="chartFallback" class="chart-fallback" hidden></div>
        </div>
      </section>

      <footer class="statusbar">
        <span id="status">Loading…</span>
      </footer>

      <!-- SETTINGS OVERLAY -->
      <div id="settingsOverlay" class="overlay" hidden>
        <div class="settings-panel">
          <div class="settings-head">
            <span>Settings</span>
            <button id="settingsClose" class="ctrl" aria-label="Close settings">✕</button>
          </div>

          <p class="hint">
            Enter your own Trello API key and token. They're stored encrypted on
            this computer and never leave it.
          </p>

          <label class="field">
            <span>API Key</span>
            <input id="apiKeyInput" type="text" autocomplete="off" spellcheck="false" placeholder="your API key" />
          </label>

          <label class="field">
            <span>Token</span>
            <input id="tokenInput" type="password" autocomplete="off" spellcheck="false" placeholder="paste token (leave blank to keep current)" />
          </label>

          <label class="field">
            <span>Board ID <em>(optional)</em></span>
            <input id="boardIdInput" type="text" autocomplete="off" spellcheck="false" placeholder="blank = first board / pick from dropdown" />
          </label>

          <div class="settings-links">
            <button id="openKeyPage" class="linkbtn" type="button">Get API key ↗</button>
            <button id="openTokenPage" class="linkbtn" type="button">Generate token ↗</button>
          </div>

          <div id="settingsMsg" class="settings-msg"></div>

          <div class="settings-actions">
            <button id="testBtn" class="btn" type="button">Test connection</button>
            <button id="saveBtn" class="btn primary" type="button">Save</button>
          </div>
          <button id="clearBtn" class="linkbtn danger" type="button">Clear saved credentials</button>
        </div>
      </div>
    </div>

    <!-- Chart.js is loaded from node_modules after `npm install`. -->
    <script src="../../node_modules/chart.js/dist/chart.umd.js"></script>
    <script src="renderer.js"></script>
  </body>
</html>
